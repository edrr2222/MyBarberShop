# No se declara un bloque `databases:` a propósito: el free tier de Render
# solo permite una base de datos Postgres activa por cuenta. Este servicio
# reutiliza una base de datos Postgres que ya existe en tu cuenta — ver
# instrucciones en el README, sección "Deploy en Render".

services:
  - type: web
    name: mybarbershop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: MyBarberShop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      # Generar localmente con: php artisan key:generate --show
      # y pegar el valor aquí manualmente en el dashboard de Render.
      - key: APP_KEY
        sync: false
      # Actualizar con la URL real que asigna Render después del primer deploy
      # (aparece en el dashboard, ej. https://mybarbershop.onrender.com).
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # Las 5 siguientes se llenan a mano en el dashboard de Render con los
      # datos de tu base de datos Postgres YA EXISTENTE (pestaña "Connect" de
      # ese servicio) — mismo host/puerto/usuario/contraseña/nombre de base
      # que usa el otro proyecto. No hace falta crear una base nueva: gracias
      # a DB_SCHEMA de abajo, todas las tablas de esta app quedan aisladas en
      # su propio schema de Postgres, sin tocar las tablas del otro proyecto.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Schema dedicado para las tablas propias de Laravel (users, sessions,
      # cache, jobs, migrations...). tenant.*/barberia.*/loyalty.* no lo
      # necesitan porque ya especifican su schema en cada modelo.
      - key: DB_SCHEMA
        value: mybarbershop
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
