# No se declara un bloque `databases:` a propósito: el free tier de Render
# solo permite una base de datos Postgres activa por cuenta. Este servicio
# reutiliza una base de datos Postgres que ya existe en tu cuenta — ver
# instrucciones en el README, sección "Deploy en Render".

services:
  - type: web
    name: mybarbershop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: MyBarberShop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      # Generar localmente con: php artisan key:generate --show
      # y pegar el valor aquí manualmente en el dashboard de Render.
      - key: APP_KEY
        sync: false
      # Actualizar con la URL real que asigna Render después del primer deploy
      # (aparece en el dashboard, ej. https://mybarbershop.onrender.com).
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # Las 5 siguientes se llenan a mano en el dashboard de Render. USA UN
      # ROL DE POSTGRES DEDICADO para esta app (nunca el usuario/contraseña
      # del otro proyecto, que tiene acceso total incluido su schema public)
      # — ver README, sección "Deploy en Render", para el script SQL que
      # crea ese rol con permisos acotados solo a DB_SCHEMA. DB_DATABASE sí
      # es el mismo nombre de base que usa el otro proyecto (se comparte la
      # instancia, no la base — no hace falta crear una base nueva).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Fuerza SSL — necesario si te conectas por la External Database URL
      # (la app y la base de datos no están en la misma red privada de
      # Render); inofensivo si terminan quedando en la misma región/red.
      - key: DB_SSLMODE
        value: require
      # Schema dedicado para las tablas propias de Laravel (users, sessions,
      # cache, jobs, migrations...). tenant.*/barberia.*/loyalty.* no lo
      # necesitan porque ya especifican su schema en cada modelo.
      - key: DB_SCHEMA
        value: mybarbershop
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
